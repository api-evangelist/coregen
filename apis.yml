aid: coregen
name: CoRegen
description: 'CoRegen, Inc. (CoRegen Science) is a clinical-stage biopharmaceutical company
  in Houston, Texas developing adoptive cell therapies for aggressive solid tumors. Its
  platform, licensed exclusively from the O''Malley Lab at Baylor College of Medicine,
  uses CRISPR gene editing to knock out the SRC-3 steroid receptor coactivator gene in
  regulatory T (Treg) cells, reprogramming them from immunosuppressors into tumor-killing
  effectors. The lead program, CRG-150, received FDA IND clearance for a first-in-human
  Phase 1/2a trial in advanced solid tumors, and the underlying science won the 2023
  Cozzarelli Prize. CoRegen is a therapeutics organization, not a software company: it
  publishes a nine-page marketing and science site (about, the science, preclinical studies,
  pipeline, publications, leadership, news, careers, contact) and no developer program,
  API, SDK, or machine-readable specification of any kind.'
